<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eleanor Voss — Private English Coaching</title>
<meta name="description" content="One-to-one English coaching for professionals. Precision, confidence, and a voice that sounds entirely your own.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     TOKENS
     ============================================================ */
  :root{
    --black:        #050505;
    --black-2:      #0a0a0b;
    --black-3:      #0e0e10;
    --ink:          #f4f2ee;
    --ink-dim:      rgba(244,242,238,0.62);
    --ink-faint:    rgba(244,242,238,0.34);

    --red-deep:     #3a0006;
    --red:          #9a0f1c;
    --red-neon:     #ff2439;
    --red-glow:     rgba(255,36,57,0.55);
    --red-glow-soft:rgba(255,36,57,0.22);

    --panel:        rgba(255,255,255,0.035);
    --panel-2:      rgba(255,255,255,0.055);
    --panel-border: rgba(255,255,255,0.09);
    --panel-border-hi: rgba(255,255,255,0.16);

    --display:  'Fraunces', serif;
    --body:     'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --ease-out:      cubic-bezier(.16,.8,.24,1);
    --ease-soft:     cubic-bezier(.22,.61,.36,1);
    --ease-in-out:   cubic-bezier(.65,0,.35,1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{
    background:var(--black);
    scroll-behavior:smooth;
  }

  body{
    background:var(--black);
    color:var(--ink);
    font-family:var(--body);
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    line-height:1.5;
  }

  ::selection{ background:var(--red-neon); color:#050505; }

  a{ color:inherit; text-decoration:none; }

  img{ display:block; max-width:100%; }

  button{ font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; }

  em{ font-style:italic; }

  /* focus visibility */
  a:focus-visible, button:focus-visible{
    outline:1px solid var(--red-neon);
    outline-offset:4px;
  }

  /* ============================================================
     AMBIENT BACKGROUND
     ============================================================ */
  #particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    opacity:.55;
  }

  .ambient-glow{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 900px 600px at 78% 8%, var(--red-glow-soft), transparent 60%),
      radial-gradient(ellipse 700px 500px at 10% 85%, rgba(154,15,28,0.16), transparent 60%);
  }

  .vignette{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(ellipse 120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ============================================================
     LAYOUT SHELL
     ============================================================ */
  main, header, footer, section{ position:relative; z-index:2; }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 32px;
  }

  /* ============================================================
     NAV
     ============================================================ */
  .nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:26px 40px;
    opacity:0;
    transform:translateY(-14px);
    transition:opacity .9s var(--ease-out), transform .9s var(--ease-out), background .4s ease, border-color .4s ease;
    border-bottom:1px solid transparent;
  }
  .nav.is-visible{ opacity:1; transform:translateY(0); }
  .nav.is-scrolled{
    background:rgba(5,5,5,0.72);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--panel-border);
  }
  .nav-mark{
    font-family:var(--display);
    font-size:19px;
    letter-spacing:.02em;
    font-weight:450;
  }
  .nav-mark span{ color:var(--red-neon); }
  .nav-cta{
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:11px 22px;
    border:1px solid var(--panel-border-hi);
    border-radius:999px;
    background:var(--panel);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    transition:border-color .3s ease, background .3s ease, box-shadow .3s ease;
  }
  .nav-cta:hover{
    border-color:var(--red-neon);
    box-shadow:0 0 24px rgba(255,36,57,0.28);
  }

  /* ============================================================
     HERO — cinematic, single composition, no boxed columns
     ============================================================ */
  .hero{
    position:relative;
    height:100vh;
    height:100dvh;
    min-height:660px;
    display:grid;
    grid-template-rows:auto 1fr auto;
    justify-items:center;
    gap:18px;
    padding:112px 0 34px;
    text-align:center;
  }

  .hero-top, .hero-bottom{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:560px;
    padding:0 24px;
  }

  /* --- the teacher: fills the flexible middle row, no container --- */
  .hero-photo-stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }

  .photo-wrap{
    position:relative;
    height:100%;
    max-height:640px;
    width:auto;
    aspect-ratio:4/5;
    max-width:min(88vw, 480px);
  }

  .eyebrow{
    font-size:12.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--red-neon);
    font-weight:500;
    margin-bottom:16px;
    opacity:0;
    transform:translateY(16px);
  }
  .is-ready .eyebrow{
    animation:fadeUp .9s var(--ease-out) 2.15s forwards;
  }

  .headline{
    font-family:var(--display);
    font-weight:450;
    font-size:clamp(34px, 5vw, 62px);
    line-height:1.05;
    letter-spacing:-.01em;
    color:var(--ink);
    opacity:0;
    transform:translateY(20px);
  }
  .is-ready .headline{
    animation:fadeUp 1s var(--ease-out) 2.3s forwards;
  }
  .headline em{
    font-style:italic;
    font-weight:400;
    background:linear-gradient(100deg, var(--red-neon), #ff6b78 55%, var(--red-neon));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 46px rgba(255,36,57,0.25);
  }

  .coach-name{
    font-size:11.5px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:16px;
    opacity:0;
    transform:translateY(14px);
  }
  .is-ready .coach-name{
    animation:fadeUp .9s var(--ease-out) 1.55s forwards;
  }
  .coach-name span{ color:var(--red-neon); }

  /* --- glow line + rising energy, centered under the photo --- */
  .hero-line-row{
    display:flex;
    justify-content:center;
    width:150px;
    height:2px;
    margin-bottom:22px;
    position:relative;
  }
  .hero-line{
    height:2px;
    width:100%;
    background:linear-gradient(90deg, transparent, var(--red-neon) 14%, var(--red-neon) 86%, transparent);
    box-shadow:0 0 14px 1px var(--red-glow), 0 0 34px 4px var(--red-glow-soft);
    transform:scaleX(0);
    transform-origin:center;
    opacity:0;
  }
  .is-ready .hero-line{
    animation:drawLine 1.15s var(--ease-in-out) 1.05s forwards;
  }
  @keyframes drawLine{
    0%{ transform:scaleX(0); opacity:0; }
    4%{ opacity:1; }
    100%{ transform:scaleX(1); opacity:1; }
  }

  .hero-energy{
    position:absolute;
    left:50%;
    bottom:100%;
    width:340px;
    max-width:70vw;
    height:180px;
    transform:translate(-50%, 20%);
    background:radial-gradient(ellipse 60% 100% at 50% 100%, var(--red-glow-soft), transparent 75%);
    filter:blur(8px);
    opacity:0;
    pointer-events:none;
  }
  .is-ready .hero-energy{
    animation:riseEnergy 2.4s var(--ease-soft) 2.05s forwards;
  }
  @keyframes riseEnergy{
    0%{ opacity:0; transform:translate(-50%, 30%); }
    35%{ opacity:.9; }
    100%{ opacity:0; transform:translate(-50%, -55%); }
  }

  .subtitle{
    font-size:clamp(15.5px, 1.5vw, 17.5px);
    line-height:1.55;
    color:var(--ink-dim);
    max-width:440px;
    margin-bottom:32px;
    opacity:0;
    transform:translateY(18px);
  }
  .is-ready .subtitle{
    animation:fadeUp .9s var(--ease-out) 2.55s forwards;
  }

  .cta-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    opacity:0;
    transform:translateY(18px);
  }
  .is-ready .cta-row{
    animation:fadeUp .9s var(--ease-out) 2.75s forwards;
  }

  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  /* --- liquid glass buttons --- */
  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:18px 34px;
    border-radius:999px;
    font-size:14.5px;
    font-weight:500;
    letter-spacing:.01em;
    isolation:isolate;
    overflow:hidden;
    transition:transform .45s var(--ease-out), box-shadow .45s var(--ease-out);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    backdrop-filter:blur(16px) saturate(140%);
  }
  .btn::before{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    z-index:-2;
  }
  .btn::after{
    content:"";
    position:absolute;
    top:0; left:-10%;
    width:60%; height:100%;
    background:linear-gradient(115deg, rgba(255,255,255,0.32), rgba(255,255,255,0) 60%);
    transform:skewX(-18deg) translateX(-140%);
    transition:transform .8s var(--ease-out);
    z-index:-1;
  }
  .btn:hover::after{ transform:skewX(-18deg) translateX(280%); }
  .btn:active{ transform:scale(.965); }

  .btn-primary{
    color:#fff;
    border:1px solid rgba(255,90,105,0.45);
    box-shadow:0 8px 30px -8px rgba(255,36,57,0.55), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .btn-primary::before{
    background:linear-gradient(160deg, rgba(154,15,28,0.85), rgba(90,4,10,0.75));
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 40px -8px rgba(255,36,57,0.7), inset 0 1px 0 rgba(255,255,255,0.24);
  }

  .btn-ghost{
    color:var(--ink);
    border:1px solid var(--panel-border-hi);
  }
  .btn-ghost::before{
    background:rgba(255,255,255,0.045);
  }
  .btn-ghost:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.6);
    border-color:rgba(255,255,255,0.3);
  }

  /* --- photo / cinematic reveal --- */
  /* the teacher herself — no frame, no border, no card. Just light and shadow. */
  .teacher-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 20%;
    filter:grayscale(.18) contrast(1.12) brightness(.92);
    /* organic fade to black — this is what removes any hard edge or "card" feeling */
    -webkit-mask-image:radial-gradient(ellipse 74% 92% at 50% 38%, #000 40%, rgba(0,0,0,.7) 60%, transparent 90%);
    mask-image:radial-gradient(ellipse 74% 92% at 50% 38%, #000 40%, rgba(0,0,0,.7) 60%, transparent 90%);
  }

  /* the darkness the light must pass through to reveal her — matches page black exactly */
  .reveal-mask{
    position:absolute; inset:0;
    z-index:4;
    background:var(--black);
    -webkit-mask-image:radial-gradient(ellipse 74% 92% at 50% 38%, #000 40%, rgba(0,0,0,.7) 60%, transparent 90%);
    mask-image:radial-gradient(ellipse 74% 92% at 50% 38%, #000 40%, rgba(0,0,0,.7) 60%, transparent 90%);
    clip-path:inset(0% 0 0 0);
  }
  .is-ready .reveal-mask{
    animation:wipeReveal 1.15s var(--ease-in-out) .3s forwards;
  }
  @keyframes wipeReveal{
    to{ clip-path:inset(100% 0 0 0); }
  }

  .light-band{
    position:absolute;
    left:-20%; right:-20%;
    top:-20%;
    height:30%;
    z-index:6;
    pointer-events:none;
    background:linear-gradient(to bottom,
      transparent,
      rgba(255,60,75,0.14) 42%,
      rgba(255,130,140,0.5) 50%,
      rgba(255,60,75,0.14) 58%,
      transparent);
    filter:blur(8px);
    opacity:0;
  }
  .is-ready .light-band{
    animation:sweepLight 1.15s var(--ease-in-out) .3s forwards;
  }
  @keyframes sweepLight{
    0%{ transform:translateY(0%); opacity:0; }
    6%{ opacity:1; }
    92%{ opacity:1; }
    100%{ transform:translateY(400%); opacity:0; }
  }

  /* ============================================================
     SCROLL CUE
     ============================================================ */
  .scroll-cue{
    position:absolute;
    bottom:34px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    opacity:0;
  }
  .is-ready .scroll-cue{
    animation:fadeUp 1s var(--ease-out) 3.3s forwards;
  }
  .scroll-cue span{
    font-size:10.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .scroll-line{
    width:1px; height:34px;
    background:linear-gradient(to bottom, var(--red-neon), transparent);
    overflow:hidden;
    position:relative;
  }
  .scroll-line::after{
    content:"";
    position:absolute; left:0; top:-100%;
    width:100%; height:100%;
    background:linear-gradient(to bottom, transparent, #fff);
    animation:scrollDrip 2.2s ease-in-out infinite;
  }
  @keyframes scrollDrip{
    0%{ top:-100%; } 100%{ top:100%; }
  }

  /* ============================================================
     REVEAL-ON-SCROLL (generic)
     ============================================================ */
  [data-reveal]{
    opacity:0;
    transform:translateY(28px);
    transition:opacity 1s var(--ease-out), transform 1s var(--ease-out);
  }
  [data-reveal].in-view{
    opacity:1;
    transform:translateY(0);
  }
  [data-reveal="1"]{ transition-delay:.05s; }
  [data-reveal="2"]{ transition-delay:.16s; }
  [data-reveal="3"]{ transition-delay:.27s; }
  [data-reveal="4"]{ transition-delay:.38s; }

  /* ============================================================
     SECTION HEADINGS (shared)
     ============================================================ */
  .section-pad{ padding:130px 0; }
  .eyebrow-sm{
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--red-neon);
    font-weight:500;
    margin-bottom:18px;
  }
  .h2{
    font-family:var(--display);
    font-weight:450;
    font-size:clamp(30px, 3.6vw, 46px);
    line-height:1.1;
    letter-spacing:-.01em;
  }
  .h2 em{ font-style:italic; font-weight:400; color:var(--red-neon); }

  /* ============================================================
     STATS STRIP
     ============================================================ */
  .stats-strip{
    padding:0 0 40px;
  }
  .stats-panel{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    border-radius:22px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    overflow:hidden;
  }
  .stat{
    padding:36px 24px;
    text-align:center;
    border-right:1px solid var(--panel-border);
  }
  .stat:last-child{ border-right:none; }
  .stat-num{
    font-family:var(--display);
    font-size:clamp(26px, 3vw, 38px);
    font-weight:450;
    color:var(--ink);
  }
  .stat-num span{ color:var(--red-neon); }
  .stat-label{
    margin-top:6px;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }

  /* ============================================================
     ABOUT
     ============================================================ */
  .about-grid{
    display:grid;
    grid-template-columns:.85fr 1.15fr;
    gap:64px;
    align-items:start;
  }
  .about-copy p{
    font-size:16px;
    line-height:1.85;
    color:var(--ink-dim);
    margin-top:20px;
    max-width:560px;
  }
  .about-copy p:first-of-type{ margin-top:26px; }
  .quote-block{
    border-left:2px solid var(--red-neon);
    padding-left:22px;
    margin-top:32px;
  }
  .quote-block p{
    font-family:var(--display);
    font-style:italic;
    font-size:19px;
    line-height:1.5;
    color:var(--ink);
    margin:0;
  }

  /* ============================================================
     METHOD
     ============================================================ */
  .method-list{
    margin-top:64px;
    display:flex;
    flex-direction:column;
  }
  .method-item{
    display:grid;
    grid-template-columns:110px 1fr;
    gap:36px;
    padding:38px 0;
    border-top:1px solid var(--panel-border);
    position:relative;
  }
  .method-item:last-child{ border-bottom:1px solid var(--panel-border); }
  .method-num{
    font-family:var(--display);
    font-size:15px;
    color:var(--red-neon);
    letter-spacing:.05em;
    padding-top:6px;
  }
  .method-body h3{
    font-family:var(--display);
    font-weight:450;
    font-size:clamp(22px, 2.4vw, 30px);
    margin-bottom:10px;
  }
  .method-body p{
    font-size:15px;
    line-height:1.75;
    color:var(--ink-dim);
    max-width:600px;
  }
  .method-item::after{
    content:"";
    position:absolute;
    left:0; top:0;
    height:0;
    width:2px;
    background:var(--red-neon);
    box-shadow:0 0 16px var(--red-glow);
    transition:height 1.1s var(--ease-out);
  }
  .method-item.in-view::after{ height:100%; }

  /* ============================================================
     TESTIMONIALS
     ============================================================ */
  .testi-grid{
    margin-top:60px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:22px;
  }
  .testi-card{
    padding:32px 28px;
    border-radius:18px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    transition:border-color .4s ease, transform .4s ease, box-shadow .4s ease;
  }
  .testi-card:hover{
    border-color:rgba(255,36,57,0.35);
    transform:translateY(-4px);
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
  }
  .testi-mark{
    font-family:var(--display);
    font-style:italic;
    font-size:34px;
    color:var(--red-neon);
    line-height:1;
    margin-bottom:14px;
    display:block;
  }
  .testi-card p{
    font-size:14.5px;
    line-height:1.75;
    color:var(--ink-dim);
  }
  .testi-name{
    margin-top:22px;
    font-size:13.5px;
    color:var(--ink);
    font-weight:500;
  }
  .testi-role{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
  }

  /* ============================================================
     BOOKING CTA
     ============================================================ */
  .booking-panel{
    position:relative;
    border-radius:28px;
    padding:80px 48px;
    text-align:center;
    background:
      radial-gradient(ellipse 600px 300px at 50% 0%, rgba(255,36,57,0.16), transparent 70%),
      var(--panel);
    border:1px solid var(--panel-border);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    overflow:hidden;
  }
  .booking-panel h2{ max-width:640px; margin:0 auto 18px; }
  .booking-panel .sub{
    color:var(--ink-dim);
    font-size:15.5px;
    max-width:440px;
    margin:0 auto 40px;
  }
  .booking-note{
    margin-top:20px;
    font-size:12.5px;
    letter-spacing:.04em;
    color:var(--ink-faint);
  }

  /* ============================================================
     FOOTER
     ============================================================ */
  footer{
    padding:64px 0 40px;
    border-top:1px solid var(--panel-border);
  }
  .footer-grid{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:24px;
  }
  .footer-mark{
    font-family:var(--display);
