<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>London</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #020202;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #020202;
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 62% 66% at 50% 48%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);
    z-index: 3;
  }

  .scene-wrap {
    opacity: 0;
    transform: scale(1.035);
    animation: sceneIn 1s cubic-bezier(.16,.8,.2,1) forwards;
  }

  @keyframes sceneIn { to { opacity: 1; transform: scale(1); } }

  svg { width: min(99vw, 1400px); height: auto; overflow: visible; display: block; }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }
  .breathing { animation: breathe 3.4s ease-in-out infinite; will-change: opacity; }

  #lampBeam { transition: opacity 0.9s ease-in-out; }
  #beamCone {
    transform: scaleY(0);
    transform-origin: 500px -860px;
    transition: transform 1.1s cubic-bezier(.25,.1,.25,1);
  }
  #beamSingle { transition: opacity 1.1s ease-in-out; }
  #lampGlow {
    transform: scale(0.45);
    transform-origin: 500px -860px;
    transition: opacity 0.9s ease-in-out, transform 1.1s cubic-bezier(.25,.1,.25,1);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="vignette"></div>
  <div class="scene-wrap">
    <svg id="scene" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#7a0d16"/>
          <stop offset="20%"  stop-color="#e2182c"/>
          <stop offset="50%"  stop-color="#ff4d5e"/>
          <stop offset="80%"  stop-color="#e2182c"/>
          <stop offset="100%" stop-color="#7a0d16"/>
        </linearGradient>
        <linearGradient id="redGradLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
          <stop offset="0%"   stop-color="#c41f2e" stop-opacity="0"/>
          <stop offset="12%"  stop-color="#8c1420" stop-opacity="0.5"/>
          <stop offset="28%"  stop-color="#e2182c" stop-opacity="0.95"/>
          <stop offset="50%"  stop-color="#ff1c30" stop-opacity="1"/>
          <stop offset="72%"  stop-color="#e2182c" stop-opacity="0.95"/>
          <stop offset="88%"  stop-color="#8c1420" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#c41f2e" stop-opacity="0"/>
        </linearGradient>
        <!-- отдельный, более тусклый градиент для ореола/свечения вокруг линии -->
        <linearGradient id="redGradGlow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
          <stop offset="0%"   stop-color="#c41f2e" stop-opacity="0"/>
          <stop offset="14%"  stop-color="#8c1420" stop-opacity="0.22"/>
          <stop offset="35%"  stop-color="#e2182c" stop-opacity="0.42"/>
          <stop offset="50%"  stop-color="#e2182c" stop-opacity="0.48"/>
          <stop offset="65%"  stop-color="#e2182c" stop-opacity="0.42"/>
          <stop offset="86%"  stop-color="#8c1420" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#c41f2e" stop-opacity="0"/>
        </linearGradient>
        <!-- земляной засвет: вертикальный градиент (яркий у линии, гаснет вниз), 
             ширина задаётся не радиальным затуханием, а маской-таперингом только по краям -->
        <linearGradient id="warmGlow" gradientUnits="userSpaceOnUse" x1="0" y1="365" x2="0" y2="440">
          <stop offset="0%"  stop-color="#ff2d3d" stop-opacity="0.55"/>
          <stop offset="30%" stop-color="#e2182c" stop-opacity="0.22"/>
          <stop offset="65%" stop-color="#c4172a" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#c4172a" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="warmGlowCore" gradientUnits="userSpaceOnUse" x1="0" y1="370" x2="0" y2="404">
          <stop offset="0%"  stop-color="#ff4550" stop-opacity="0.7"/>
          <stop offset="40%" stop-color="#e2182c" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#e2182c" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="floodEdgeFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="6%"   stop-color="#ffffff" stop-opacity="0.7"/>
          <stop offset="22%"  stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="78%"  stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="94%"  stop-color="#ffffff" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <mask id="floodMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="560" style="mask-type:alpha;">
          <rect x="0" y="0" width="1000" height="560" fill="url(#floodEdgeFade)"/>
        </mask>
        <linearGradient id="buildingFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#141414"/>
          <stop offset="100%" stop-color="#050505"/>
        </linearGradient>
        <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
        <filter id="strongBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>

        <!-- линия у горизонта: сильный вертикальный blur, почти без горизонтального —
             даёт широкий мягкий "заплыв" света вверх/вниз, а не размытие вдоль линии -->
        <filter id="lineBleedWide" x="-5%" y="-120%" width="110%" height="300%"><feGaussianBlur stdDeviation="1 2.6"/></filter>
        <filter id="lineBleedMid"  x="-5%" y="-100%" width="110%" height="250%"><feGaussianBlur stdDeviation="0.6 1.4"/></filter>
        <filter id="lineBleedTight" x="-5%" y="-150%" width="110%" height="400%"><feGaussianBlur stdDeviation="0.3 2"/></filter>

        <!-- ====== ЛУЧ ПРОЖЕКТОРА (по референсу): чистый мягкий блюр, без шума ====== -->
        <linearGradient id="beamGrad2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ff5b64" stop-opacity="1"/>
          <stop offset="14%"  stop-color="#ff3040" stop-opacity="1"/>
          <stop offset="42%"  stop-color="#e2182c" stop-opacity="0.88"/>
          <stop offset="72%"  stop-color="#c4172a" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#c4172a" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="beamGradCoreLine" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ffb3b8" stop-opacity="0.95"/>
          <stop offset="20%"  stop-color="#ff4550" stop-opacity="0.85"/>
          <stop offset="55%"  stop-color="#e2182c" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#e2182c" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="lampCore2" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#ff8087" stop-opacity="1"/>
          <stop offset="35%"  stop-color="#ff2d3d" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#e2182c" stop-opacity="0"/>
        </radialGradient>
        <filter id="beamBlurXXL" x="-300%" y="-40%" width="700%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
        <filter id="beamBlurXL"  x="-250%" y="-40%" width="600%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
        <filter id="beamBlurL"   x="-200%" y="-30%" width="500%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
        <filter id="beamBlurM"   x="-150%" y="-30%" width="400%" height="170%"><feGaussianBlur stdDeviation="21"/></filter>
        <filter id="beamBlurS"   x="-100%" y="-20%" width="300%" height="150%"><feGaussianBlur stdDeviation="14"/></filter>
        <filter id="beamBlurXS"  x="-80%"  y="-20%" width="260%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
        <!-- ====== конец блока луча ====== -->
      </defs>

      <rect id="warmSpot" x="0" y="365" width="1000" height="75" fill="url(#warmGlow)" mask="url(#floodMask)" filter="url(#softBlur)" opacity="0"/>
      <rect id="warmSpotCore" x="0" y="370" width="1000" height="34" fill="url(#warmGlowCore)" mask="url(#floodMask)" filter="url(#softBlur)" opacity="0"/>

      <g id="reflectionGroup" transform="scale(1,-1)" transform-origin="500 361" style="opacity:0">
        <line id="reflGlow" x1="500" y1="361" x2="500" y2="361" stroke="#e2182c" stroke-width="6" stroke-linecap="round" filter="url(#softBlur)"/>
        <line id="reflLine" x1="500" y1="361" x2="500" y2="361" stroke="#e2182c" stroke-width="1" stroke-linecap="round"/>
      </g>

      <!-- фоновый плотный силуэт застройки -->
      <g id="cityScale" transform="translate(500,360) scale(1.65) translate(-500,-360)">
        <g id="skylineFill"></g>
        <!-- окна фоновых зданий -->
        <g id="windows"></g>

        <!-- контур ключевых зданий -->
        <g id="cityGlow" filter="url(#softBlur)" opacity="0"></g>
        <g id="city"></g>
      </g>

      <!-- красный свет от столба, льющийся сверху на город -->
      <g id="lampBeam" style="opacity:0">
        <!-- тонкая опора фонаря, уходящая за верхний край -->
        <path d="M 500 -900 L 500 -860" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
        <g id="beamCone">
          <!-- один слой: широкий конус + сильный Gaussian Blur — мягкие края и плавное затухание
               получаются от самого blur, без стопки отдельных слоёв -->
          <path id="beamSingle" d="M 500 -860 L 960 430 L 40 430 Z"
            fill="url(#beamGrad2)" filter="url(#beamBlurL)" opacity="0"/>
        </g>
        <ellipse id="lampGlow" cx="500" cy="-860" rx="60" ry="30" fill="url(#lampCore2)" filter="url(#beamBlurM)" opacity="0"/>
        <circle id="lampBulb" cx="500" cy="-860" r="7" fill="#ff2d3d" filter="url(#softBlur)"/>
      </g>

      <!-- красная линия под городом (тонкая, с затуханием градиента по краям) -->
      <path id="glowLine" fill="none" stroke="url(#redGradGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineBleedWide)" opacity="0"/>
      <path id="midLine"  fill="none" stroke="url(#redGradGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineBleedMid)" opacity="0"/>
      <path id="redLine"  fill="none" stroke="url(#redGradLine)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineBleedTight)" opacity="0"/>
      <path id="redLineCore" fill="none" stroke="#ff8f96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>

      <g id="particles"></g>
    </svg>
  </div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";

  // ---------- ключевые здания (линия-арт, прорисовываются) ----------
  const cityPaths = [
    // Парламент
    "M 195 360 L 195 328 L 206 328 L 206 360",
    "M 206 360 L 206 300 L 218 300 L 218 360",
    "M 218 316 L 218 300 L 292 300 L 292 316",
    "M 226 360 L 226 316 M 238 360 L 238 316 M 250 360 L 250 316 M 262 360 L 262 316 M 274 360 L 274 316 M 286 360 L 286 316",
    "M 292 360 L 292 300 L 304 300 L 304 360",

    // Биг-Бен
    "M 316 360 L 316 205 L 322 190 C 325 180 343 180 346 190 L 352 205 L 352 360",
    "M 322 190 L 346 190",
    "M 330 176 L 330 150 L 338 150 L 338 176",
    "M 334 150 C 334 142 334 136 334 128",
    "M 316 232 L 352 232 M 316 260 L 352 260 M 316 288 L 352 288 M 316 316 L 352 316",
    "M 325 205 C 325 197 343 197 343 205 C 343 213 325 213 325 205",

    // Малая башня
    "M 366 360 L 366 250 L 374 230 L 382 250 L 382 360",
    "M 366 280 L 382 280 M 366 310 L 382 310",

    // Тауэрский мост
    "M 424 360 L 424 250 L 408 250 L 408 230 C 408 224 464 224 464 230 L 464 250 L 448 250 L 448 360",
    "M 408 292 L 464 292",
    "M 408 264 L 464 264",
    "M 424 360 L 466 360",
    "M 466 360 L 466 250 L 450 250",
    "M 466 296 C 484 288 504 288 522 296",
    "M 522 360 L 522 250 L 506 250 L 506 230 C 506 224 562 224 562 230 L 562 250 L 546 250 L 546 360",
    "M 506 292 L 562 292 M 506 264 L 562 264",
    "M 484 360 L 564 360",

    // Купол Св. Павла
    "M 578 360 L 578 336 L 660 336 L 660 360",
    "M 592 336 C 588 300 594 280 619 268 C 644 280 650 300 646 336",
    "M 610 296 C 606 292 606 284 610 280 C 606 276 606 268 610 264 L 628 264 C 632 268 632 276 628 280 C 632 284 632 292 628 296 Z",
    "M 619 264 C 619 254 619 244 619 234",
    "M 606 336 L 606 318 M 632 336 L 632 318",

    // London Eye
    "M 810 292 m -66 0 a 66 66 0 1 0 132 0 a 66 66 0 1 0 -132 0",
    "M 810 226 L 810 358 M 744 292 L 876 292 M 764 246 L 856 338 M 764 338 L 856 246",
    "M 810 358 m -11 0 a 11 11 0 1 0 22 0 a 11 11 0 1 0 -22 0",
    "M 787 360 L 833 360 M 799 358 L 799 360 M 821 358 L 821 360",

    // The Shard
    "M 686 360 C 690 320 696 270 702 236 C 708 270 714 320 718 360",
    "M 691 328 L 713 328 M 695 296 L 709 296",

    // Букингемский дворец
    "M 6 360 L 6 348 L 10 348 L 10 318 L 165 318 L 165 345 L 178 345 L 178 360",
    "M 70 318 L 87 299 L 104 318",
    "M 10 340 L 165 340",
    "M 20 360 L 20 318 M 32 360 L 32 318 M 44 360 L 44 318 M 56 360 L 56 318 M 118 360 L 118 318 M 130 360 L 130 318 M 142 360 L 142 318 M 154 360 L 154 318",
    "M 70 360 L 70 299 M 82 360 L 82 299 M 92 360 L 92 299 M 104 360 L 104 299",
    "M 78 360 L 78 334 L 96 334 L 96 360",
    "M 78 334 L 96 334 M 81 334 L 81 342 M 87 334 L 87 342 M 93 334 L 93 342",
    "M 87 299 L 87 274",
    "M 87 276 L 106 281 L 87 287",
    "M 2 360 L 182 360",
    "M 15 360 L 15 353 M 30 360 L 30 353 M 45 360 L 45 353 M 60 360 L 60 353 M 115 360 L 115 353 M 130 360 L 130 353 M 145 360 L 145 353 M 160 360 L 160 353",

    // между Биг-Беном и мостом
    "M 392 360 L 392 310 L 402 310 L 402 360",
    "M 396 360 L 396 310",

    // между мостом и куполом
    "M 566 360 L 566 315 L 578 315 L 578 360",

    // между куполом и Шардом
    "M 664 360 L 664 300 L 680 300 L 680 360",
    "M 668 360 L 668 300 M 676 360 L 676 300",

    // между Шардом и Глазом
    "M 724 360 L 724 290 L 740 290 L 740 360",
    "M 728 360 L 728 290 M 736 360 L 736 290",

    // справа от Глаза
    "M 882 360 L 882 320 L 896 320 L 896 360",
    "M 900 360 L 900 300 L 914 300 L 914 360",
    "M 904 360 L 904 300 M 910 360 L 910 300",
    "M 918 360 L 918 335 L 930 335 L 930 360",

    // самые крайние домики справа
    "M 938 360 L 938 330 L 954 330 L 954 360",
    "M 954 360 L 954 345 L 968 345 L 968 360",
    "M 974 360 L 974 312 L 990 312 L 990 360",
    "M 978 360 L 978 312 M 986 360 L 986 312"
  ];

   // ---------- фоновая плотная застройка (заполненные силуэты) ----------
  function buildSkyline() {
    const fillGroup = document.getElementById("skylineFill");
    const windowGroup = document.getElementById("windows");

    // псевдослучайный, но детерминированный генератор
    let seed = 42;
    function rnd() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    }

    let x = 0;
    const rightEdge = 1000;
    const baseY = 360;
    const buildings = [];

    while (x < rightEdge) {
      const w = 14 + rnd() * 20;
      const h = 24 + rnd() * 84;
      buildings.push({ x, w, h });
      x += w + (2 + rnd() * 5);
    }

    buildings.forEach((b, i) => {
      const rect = document.createElementNS(NS, "rect");
      rect.setAttribute("x", b.x);
      rect.setAttribute("y", baseY - b.h);
      rect.setAttribute("width", b.w);
      rect.setAttribute("height", b.h);
      rect.setAttribute("fill", "url(#buildingFill)");
      rect.setAttribute("stroke", "rgba(255,255,255,0.06)");
      rect.setAttribute("stroke-width", "0.6");
      rect.setAttribute("opacity", "0");
      fillGroup.appendChild(rect);

      // окна
      const cols = Math.max(1, Math.floor(b.w / 6));
      const rows = Math.max(1, Math.floor(b.h / 9));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (rnd() > 0.42) continue;
          const wx = b.x + 2.5 + c * 6;
          const wy = baseY - b.h + 4 + r * 9;
          if (wx > b.x + b.w - 2) continue;
          const win = document.createElementNS(NS, "rect");
          win.setAttribute("x", wx);
          win.setAttribute("y", wy);
          win.setAttribute("width", "2.3");
          win.setAttribute("height", "3.4");
          const warm = rnd() > 0.5;
          win.setAttribute("fill", warm ? "#ffb37a" : "#ffffff");
          win.setAttribute("opacity", "0");
          win.dataset.maxOp = (0.15 + rnd() * 0.35).toFixed(2);
          windowGroup.appendChild(win);
        }
      }
    });

    return { buildings };
  }

  const { } = buildSkyline();

  const cityGroup = document.getElementById("city");
  const glowGroup = document.getElementById("cityGlow");

  // индексы путей, относящихся к London Eye — рисуем их жирнее
  const eyeIndices = new Set([27, 28, 29, 30]);

  const elements = cityPaths.map((d, idx) => {
    const isEye = eyeIndices.has(idx);

    const p1 = document.createElementNS(NS, "path");
    p1.setAttribute("d", d);
    p1.setAttribute("fill", "none");
    p1.setAttribute("stroke", "rgba(215,210,200,0.55)");
    p1.setAttribute("stroke-width", isEye ? "4.2" : "2.6");
    p1.setAttribute("stroke-linecap", "round");
    p1.setAttribute("stroke-linejoin", "round");
    cityGroup.appendChild(p1);

    let p2 = null;
    if (idx < 33) { // только ключевые здания получают отдельный blur-контур — мелкие домики его не требуют
      p2 = document.createElementNS(NS, "path");
      p2.setAttribute("d", d);
      p2.setAttribute("fill", "none");
      p2.setAttribute("stroke", "rgba(215,210,200,0.28)");
      p2.setAttribute("stroke-width", isEye ? "8" : "5.5");
      p2.setAttribute("stroke-linecap", "round");
      p2.setAttribute("stroke-linejoin", "round");
      glowGroup.appendChild(p2);
    }

    const len = p1.getTotalLength();
    [p1, p2].forEach(el => {
      if (!el) return;
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      el.style.opacity = 1;
    });

    const match = d.match(/M\s*([\d.\-]+)[ ,]([\d.\-]+)/);
    const cx = match ? parseFloat(match[1]) : 500;
    return { main: p1, glow: p2, len, cx };
  });

  function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }
  function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

  function animateValue(duration, delay, onFrame, onDone) {
    setTimeout(() => {
      const start = performance.now();
      function frame(now) {
        let t = Math.min(1, (now - start) / duration);
        onFrame(t);
        if (t < 1) requestAnimationFrame(frame);
        else if (onDone) onDone();
      }
      requestAnimationFrame(frame);
    }, delay);
  }

  // --- красная линия под городом: живая волна во всю ширину ---
  const redLine = document.getElementById("redLine");
  const midLine = document.getElementById("midLine");
  const glowLine = document.getElementById("glowLine");
  const redLineCore = document.getElementById("redLineCore");
  const reflectionGroup = document.getElementById("reflectionGroup");
  const warmSpot = document.getElementById("warmSpot");
  const warmSpotCore = document.getElementById("warmSpotCore");
  const lampBeam = document.getElementById("lampBeam");
  const beamCone = document.getElementById("beamCone");
  const lampGlow = document.getElementById("lampGlow");
  const beamSingle = document.getElementById("beamSingle");

  function waveD(phase, amp) {
    let d = "";
    const xStart = 220, xEnd = 780; // линия заметно короче ширины сцены по горизонтали
    for (let x = xStart; x <= xEnd; x += 20) {
      const y = 374 + amp * Math.sin(x / 130 + phase) + amp * 0.35 * Math.sin(x / 47 - phase * 1.6);
      d += (x === xStart ? "M " : "L ") + x.toFixed(1) + " " + y.toFixed(1) + " ";
    }
    return d;
  }

  [glowLine, midLine, redLine, redLineCore].forEach(l => {
    l.setAttribute("d", waveD(0, 0));
    const len = l.getTotalLength();
    l.dataset.len = len;
    l.style.strokeDasharray = len;
    l.style.strokeDashoffset = len;
    l.style.opacity = 1;
  });

  // город и линия рисуются в исходном, более неспешном темпе; луч всё так же стартует почти сразу
  const citySweepDelay = 250;
  const citySweepSpan = 2100;
  const citySweepPer = 620;
  const citySweepDuration = citySweepSpan + citySweepPer; // = totalSpan + perDuration из startCity()

  animateValue(citySweepDuration, citySweepDelay, t => {
    const e = easeInOutCubic(t);
    [glowLine, midLine, redLine, redLineCore].forEach(l => {
      const len = parseFloat(l.dataset.len);
      l.style.strokeDashoffset = len * (1 - e);
    });
  }, () => {
    setTimeout(() => {
      warmSpot.classList.add("breathing");
      warmSpotCore.classList.add("breathing");
      glowLine.classList.add("breathing");
      redLineCore.classList.add("breathing");
    }, 150);
  });

  // фонарь загорается сразу вместе с линией и городом, а не после них —
  // лампа, ореол и конус мягко проявляются (opacity + scale) почти встык друг за другом
  lampBeam.style.opacity = "1";
  setTimeout(() => { lampGlow.style.opacity = "1"; lampGlow.style.transform = "scale(1)"; }, citySweepDelay + 60);
  setTimeout(() => {
    beamCone.style.transform = "scaleY(1)";
    beamSingle.style.opacity = "1";
  }, citySweepDelay + 150);

  // тёплое свечение под городом и отражение — та же волна, лёгкий сдвиг для глубины
  setTimeout(() => {
    reflectionGroup.style.transition = "opacity 1.1s ease-in-out";
    reflectionGroup.style.opacity = 0.14;
    warmSpot.style.transition = "opacity 1.1s ease-in-out";
    warmSpot.style.opacity = "1";
    warmSpotCore.style.transition = "opacity 1.1s ease-in-out";
    warmSpotCore.style.opacity = "1";
  }, citySweepDelay + 130);

  revealSkylineFill();
  startCity();
  lightWindows();
  setTimeout(startAmbient, citySweepDelay + citySweepDuration);

  // --- фоновая застройка проступает слева направо, вместе с линией и городом ---
  function revealSkylineFill() {
    const rects = document.querySelectorAll("#skylineFill rect");
    rects.forEach(r => {
      const x = parseFloat(r.getAttribute("x")) + parseFloat(r.getAttribute("width")) / 2;
      const delay = citySweepDelay + (x / 1000) * citySweepSpan + Math.random() * 120;
      setTimeout(() => {
        r.style.transition = "opacity 1s ease-in-out";
        r.setAttribute("opacity", "1");
      }, delay);
    });
  }

  // --- ключевые здания прорисовываются слева направо ---
  function startCity() {
    const sorted = [...elements].sort((a, b) => a.cx - b.cx);

    sorted.forEach(item => {
      const delay = citySweepDelay + (item.cx / 1000) * citySweepSpan;
      animateValue(citySweepPer, delay, t => {
        const e = easeInOutCubic(t);
        const offset = item.len * (1 - e);
        item.main.style.strokeDashoffset = offset;
        item.glow && (item.glow.style.strokeDashoffset = offset);
      });
    });
  }

  // --- окна зажигаются ---
  function lightWindows() {
    const wins = document.querySelectorAll("#windows rect");
    wins.forEach(w => {
      const x = parseFloat(w.getAttribute("x"));
      const delay = (citySweepDelay + (x / 1000) * citySweepSpan + Math.random() * 250).toFixed(0);
      w.style.transition = `opacity 1.4s cubic-bezier(0.25,0.1,0.25,1) ${delay}ms`;
    });
    // force one reflow so the transition-delay is registered before we flip opacity,
    // then trigger every window's fade-in at once — the stagger comes purely from CSS delay, not JS timers
    void document.getElementById("windows").offsetHeight;
    wins.forEach(w => { w.style.opacity = w.dataset.maxOp; });
  }

  // --- частицы пыли ---
  const particlesGroup = document.getElementById("particles");
  const particleData = [];
  for (let i = 0; i < 10; i++) {
    const el = document.createElementNS(NS, "circle");
    const x = 100 + Math.random() * 800;
    const y = 150 + Math.random() * 260;
    const r = 0.6 + Math.random() * 1.1;
    el.setAttribute("cx", x);
    el.setAttribute("cy", y);
    el.setAttribute("r", r);
    el.setAttribute("fill", "#ffffff");
    el.style.opacity = "0";
    particlesGroup.appendChild(el);
    particleData.push({ el, x, y, speed: 4 + Math.random() * 8, phase: Math.random() * Math.PI * 2, maxOp: 0.15 + Math.random() * 0.25 });
  }

  function startAmbient() {
    particleData.forEach((p, i) => {
      setTimeout(() => { p.el.style.transition = "opacity 2s ease"; p.el.setAttribute("opacity", p.maxOp); }, i * 90);
    });

    // мерцание некоторых окон
    const wins = [...document.querySelectorAll("#windows rect")];
    const flickerSet = wins.filter(() => Math.random() < 0.15);
    function flickerLoop() {
      flickerSet.forEach(w => {
        if (Math.random() < 0.02) {
          const orig = parseFloat(w.dataset.maxOp);
          w.style.transition = "opacity 0.12s ease";
          w.style.opacity = (orig * 0.15).toFixed(2);
          setTimeout(() => { w.style.opacity = orig; }, 120 + Math.random() * 150);
        }
      });
      requestAnimationFrame(flickerLoop);
    }
    flickerLoop();
  }
})();
</script>
