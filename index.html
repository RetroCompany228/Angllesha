<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Вчитель Англійської</title>
<style>
  :root{
    --red: #ff1f2e;
    --red-deep: #7a0d14;
    --red-soft: rgba(255,31,46,0.55);
    --paper: #f3ede4;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  body{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
  }

  canvas#particles{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
  }

  /* ambient corner glows to fill the void */
  .corner-glow{
    position:absolute;
    width:60vw;
    height:60vw;
    max-width:520px;
    max-height:520px;
    border-radius:50%;
    filter: blur(70px);
    opacity:0;
    pointer-events:none;
    z-index:1;
    animation: glowIn 2.4s ease-out 1.6s forwards;
  }
  .corner-glow.left{
    bottom:-18%;
    left:-24%;
    background: radial-gradient(circle, rgba(180,10,20,0.35), transparent 70%);
  }
  .corner-glow.right{
    top:-14%;
    right:-26%;
    background: radial-gradient(circle, rgba(120,5,15,0.28), transparent 70%);
  }
  @keyframes glowIn{ from{ opacity:0; } to{ opacity:1; } }

  .bg-ring{
    position:absolute;
    width:70vw;
    height:70vw;
    max-width:640px;
    max-height:640px;
    bottom:-30%;
    right:-30%;
    border-radius:50%;
    border:1px solid rgba(255,60,70,0.1);
    z-index:1;
    opacity:0;
    animation: glowIn 2.4s ease-out 4.2s forwards, bgRingSpin 90s linear 4.2s infinite;
  }
  @keyframes bgRingSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

  /* rotating decorative ring behind portrait */
  .ring{
    position:absolute;
    top:2%;
    left:50%;
    width:min(78vw, 400px);
    height:min(78vw, 400px);
    transform:translateX(-50%);
    border-radius:50%;
    border:1px dashed rgba(255,60,70,0.22);
    opacity:0;
    z-index:2;
    animation: ringIn 1.2s ease-out 1.4s forwards, ringSpin 40s linear 1.4s infinite;
  }
  .ring.small{
    width:min(64vw, 330px);
    height:min(64vw, 330px);
    top:6%;
    border-color: rgba(255,60,70,0.14);
    animation: ringIn 1.2s ease-out 1.6s forwards, ringSpin 60s linear reverse 1.6s infinite;
  }
  .ring.accent{
    width:min(88vw, 440px);
    height:min(88vw, 440px);
    top:-2%;
    border-style:solid;
    border-width:1px;
    border-color: rgba(255,40,50,0.16);
    box-shadow: 0 0 24px 2px rgba(255,30,40,0.12) inset;
    animation: ringIn 1.2s ease-out 1.9s forwards, ringSpin 75s linear 1.9s infinite, ringPulse 3.6s ease-in-out 2.6s infinite;
  }
  @keyframes ringIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes ringSpin{ from{ transform:translateX(-50%) rotate(0deg); } to{ transform:translateX(-50%) rotate(360deg); } }
  @keyframes ringPulse{ 0%,100%{ border-color: rgba(255,40,50,0.10); } 50%{ border-color: rgba(255,60,70,0.32); } }

  /* subtle grain texture for a premium finish */
  .grain{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:6;
    opacity:0.05;
    mix-blend-mode: overlay;
    pointer-events:none;
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- beam ---------- */
  .beam-wrap{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    height:60%;
    max-height:600px;
    display:flex;
    justify-content:center;
    overflow:visible;
    pointer-events:none;
  }

  .beam{
    position:absolute;
    top:0;
    width:640px;
    max-width:130vw;
    height:100%;
    background:
      radial-gradient(ellipse 65% 100% at 50% 0%,
        rgba(255,60,60,0.85) 0%,
        rgba(255,30,40,0.42) 24%,
        rgba(200,10,20,0.17) 48%,
        rgba(120,0,10,0.06) 70%,
        rgba(0,0,0,0) 88%);
    clip-path: polygon(50% 0%, 118% 100%, -18% 100%);
    filter: blur(38px);
    opacity:0;
    transform: scaleY(0);
    transform-origin: top center;
    animation: beamGrow 1.8s cubic-bezier(.2,.7,.2,1) 1.15s forwards;
  }

  .beam::after{
    content:"";
    position:absolute;
    top:0; left:50%;
    width:3px; height:40px;
    background: radial-gradient(circle, #fff 0%, var(--red) 60%, transparent 100%);
    transform:translateX(-50%);
    filter: blur(1px);
    border-radius:50%;
  }

  @keyframes beamGrow{
    0%   { opacity:0; transform: scaleY(0); }
    12%  { opacity:1; }
    100% { opacity:1; transform: scaleY(1); }
  }

  /* ---------- portrait ---------- */
  .portrait-wrap{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:min(56vw, 300px);
    height:43%;
    max-height:430px;
    overflow:hidden;
    clip-path: inset(0 0 100% 0);
    animation: revealDown 1.6s cubic-bezier(.2,.7,.2,1) 1.15s forwards;
    z-index:3;
  }

  @keyframes revealDown{
    0%   { clip-path: inset(0 0 100% 0); }
    100% { clip-path: inset(0 0 0% 0); }
  }

  .portrait{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: 50% 0%;
    opacity:0;
    animation: portraitFade 1.4s ease-out 1.3s forwards;
    filter: contrast(1.05) saturate(1.05);
    mix-blend-mode: screen;
  }

  @keyframes portraitFade{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  /* ---------- divider ---------- */
  .divider-row{
    position:absolute;
    top:46%;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    z-index:4;
  }

  .divider{
    position:relative;
    height:2px;
    width:0%;
    max-width:92%;
    background: linear-gradient(90deg,
      rgba(255,31,46,0) 0%,
      var(--red) 15%,
      #fff 50%,
      var(--red) 85%,
      rgba(255,31,46,0) 100%);
    box-shadow: 0 0 12px 1px var(--red-soft), 0 0 28px 4px rgba(255,20,30,0.25);
    animation: drawLine 1.1s cubic-bezier(.3,.8,.25,1) 0.25s forwards;
  }

  @keyframes drawLine{
    from{ width:0%; }
    to{ width:92%; }
  }

  /* ---------- content ---------- */
  .content{
    position:absolute;
    top:calc(46% + 14px);
    left:0;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:4;
  }

  /* glass panel — water-like frosted card */
  @property --angle{
    syntax:'<angle>';
    inherits:false;
    initial-value:0deg;
  }

  .glass-panel{
    position:relative;
    width:100%;
    text-align:center;
    padding: 24px 8vw 16px;
    border-radius: 30px 30px 0 0;
    background: linear-gradient(180deg, rgba(35,10,10,0.42), rgba(10,3,3,0.68));
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    overflow:hidden;
    isolation:isolate;
    opacity:0;
    animation: panelIn 1.1s ease-out 1.7s forwards;
  }

  @keyframes panelIn{ from{ opacity:0; } to{ opacity:1; } }

  .glass-panel::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    padding:1.4px;
    background: conic-gradient(from var(--angle,0deg),
      rgba(255,40,50,0.95),
      rgba(255,255,255,0.55) 15%,
      rgba(255,40,50,0.15) 35%,
      rgba(255,40,50,0.85) 60%,
      rgba(255,255,255,0.4) 78%,
      rgba(255,40,50,0.95));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: rotateAngle 5s linear infinite;
    pointer-events:none;
    z-index:2;
  }

  @keyframes rotateAngle{ to{ --angle:360deg; } }

  /* diagonal shimmer sweep — glass / water reflection */
  .glass-panel::after{
    content:"";
    position:absolute;
    top:-60%;
    left:-60%;
    width:55%;
    height:220%;
    background: linear-gradient(115deg,
      transparent 30%,
      rgba(255,255,255,0.10) 46%,
      rgba(255,255,255,0.22) 50%,
      rgba(255,255,255,0.10) 54%,
      transparent 70%);
    transform: rotate(6deg);
    animation: shimmerSweep 5.5s ease-in-out infinite;
    animation-delay: 4.6s;
    pointer-events:none;
    z-index:2;
  }

  @keyframes shimmerSweep{
    0%   { left:-60%; }
    28%  { left:130%; }
    100% { left:130%; }
  }

  .glass-panel > *{ position:relative; z-index:3; }

  h1{
    font-weight:800;
    line-height:1.05;
    letter-spacing:0.5px;
    opacity:0;
    transform:translateY(14px);
    animation: fadeUp .9s ease-out 2.75s forwards;
  }

  h1 .line1{
    display:block;
    font-size: clamp(26px, 7vw, 40px);
    color:#f2f0ee;
    text-shadow: 0 0 18px rgba(255,255,255,0.15);
  }

  h1 .line2{
    display:block;
    font-size: clamp(32px, 9vw, 52px);
    background: linear-gradient(180deg, #ff5b5b 0%, var(--red) 45%, #7a0d14 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 0 26px rgba(255,20,30,0.45);
    margin-top:2px;
  }

  .subtitle{
    margin-top:8px;
    font-size: clamp(13px, 3.4vw, 15px);
    color: rgba(230,222,218,0.72);
    font-weight:400;
    letter-spacing:0.2px;
    max-width:280px;
    line-height:1.45;
    opacity:0;
    transform:translateY(12px);
    animation: fadeUp .9s ease-out 3.0s forwards;
  }

  .actions{
    display:flex;
    gap:16px;
    margin-top: clamp(16px, 3vh, 26px);
    opacity:0;
    transform:translateY(14px);
    animation: fadeUp .9s ease-out 3.45s forwards;
  }

  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 13px 22px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    letter-spacing:0.2px;
    white-space:nowrap;
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform .25s ease;
    overflow:hidden;
  }

  .btn::before{
    content:"";
    position:absolute;
    top:0; left:-70%;
    width:40%; height:100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    animation: btnShine 4.5s ease-in-out infinite;
    pointer-events:none;
  }

  .btn-primary::before{ animation-delay: 3.8s; }
  .btn-ghost::before{ animation-delay: 4.3s; }

  @keyframes btnShine{
    0%   { left:-70%; }
    22%  { left:130%; }
    100% { left:130%; }
  }

  .btn:active{ transform: scale(0.96); }

  .btn svg{ width:15px; height:15px; flex-shrink:0; }

  .btn-primary{
    color:#fff;
    background: linear-gradient(180deg, #ff3b3b, #b3131c);
    border-color: rgba(255,90,90,0.5);
    box-shadow: 0 4px 22px rgba(255,20,30,0.35);
  }

  .btn-ghost{
    color:#f1eae4;
    background: rgba(20,10,10,0.55);
  }

  /* online status badge near the portrait */
  .badge{
    position:absolute;
    top:29%;
    right:4%;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(15,6,6,0.55);
    border:1px solid rgba(255,80,90,0.25);
    backdrop-filter: blur(4px);
    font-size:11px;
    letter-spacing:0.3px;
    color:rgba(240,230,225,0.85);
    opacity:0;
    z-index:5;
    animation: fadeUp .8s ease-out 2.9s forwards;
  }

  .badge .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:#3ddc6a;
    box-shadow:0 0 8px #3ddc6a;
    animation: pulseDot 1.8s ease-in-out infinite;
  }

  @keyframes pulseDot{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(0.8); }
  }

  .badge.lang{
    top:18%;
    left:3%;
    right:auto;
    animation-delay: 2.6s;
  }

  /* features row */
  .features{
    display:flex;
    align-items:stretch;
    gap:14px;
    margin-top: clamp(14px, 2.6vh, 22px);
    opacity:0;
    transform:translateY(12px);
    animation: fadeUp .9s ease-out 3.85s forwards;
  }

  .feature{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    width:78px;
  }

  .feature svg{
    width:18px;
    height:18px;
    color: var(--red);
    filter: drop-shadow(0 0 6px rgba(255,30,40,0.6));
  }

  .feature span{
    font-size:10.5px;
    line-height:1.25;
    color:rgba(225,215,212,0.65);
    letter-spacing:0.1px;
  }

  .feature-divider{
    width:1px;
    background:linear-gradient(180deg, transparent, rgba(255,60,70,0.3), transparent);
  }

  /* footer contact row */
  .footer{
    position:absolute;
    bottom:3.5%;
    left:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    z-index:4;
    opacity:0;
    animation: fadeUp .9s ease-out 4.5s forwards;
  }

  .footer a{
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid rgba(255,80,90,0.22);
    background:rgba(15,6,6,0.4);
    color:rgba(230,220,216,0.7);
    text-decoration:none;
    transition: transform .2s ease, border-color .2s ease;
  }

  .footer a:active{ transform:scale(0.92); }

  .footer svg{ width:15px; height:15px; }

  /* glow pulses emanating toward center, from both sides */
  .actions::before, .actions::after{
    content:"";
    position:absolute;
    top:50%;
    width:120px;
    height:70px;
    border-radius:50%;
    filter: blur(22px);
    opacity:0;
    animation: sideGlow 3.2s ease-in-out 3.8s infinite;
    pointer-events:none;
  }

  .actions::before{
    left:-40px;
    transform: translateY(-50%);
    background: radial-gradient(circle, rgba(255,40,50,0.55), transparent 70%);
    animation-delay: 3.8s;
  }

  .actions::after{
    right:-40px;
    transform: translateY(-50%);
    background: radial-gradient(circle, rgba(255,40,50,0.55), transparent 70%);
    animation-delay: 4.1s;
  }

  @keyframes sideGlow{
    0%   { opacity:0; }
    35%  { opacity:1; }
    70%  { opacity:0.35; }
    100% { opacity:0; }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to  { opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .beam, .portrait, .divider, h1, .actions{ animation-duration:0.01s !important; animation-delay:0s !important; }
    .actions::before, .actions::after{ animation:none; opacity:0; }
  }
</style>
</head>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
    <feColorMatrix type="saturate" values="0"></feColorMatrix>
  </filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"></rect>
</svg>

<canvas id="particles"></canvas>

<div class="corner-glow left"></div>
<div class="corner-glow right"></div>
<div class="bg-ring"></div>

<div class="stage">
  <div class="beam-wrap"><div class="beam"></div></div>

<script>
(function(){
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var W, H, dpr;
  var particles = [];
  var orbs = [];
  var COUNT = 140;
  var ORB_COUNT = 9;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function rand(a,b){ return a + Math.random()*(b-a); }

  function makeParticle(){
    var isWhite = Math.random() < 0.25;
    return {
      x: rand(0, W),
      y: rand(0, H),
      r: rand(0.6, 1.8),
      speed: rand(6, 18) / 60,
      drift: rand(-0.15, 0.15),
      alpha: rand(0.15, 0.75),
      twinkle: rand(0.005, 0.02),
      phase: rand(0, Math.PI*2),
      color: isWhite ? '255,255,255' : '255,40,50'
    };
  }

  function makeOrb(){
    return {
      x: rand(0, W),
      y: rand(0, H),
      r: rand(50, 130),
      speed: rand(2, 6) / 60,
      drift: rand(-0.05, 0.05),
      alpha: rand(0.03, 0.09),
      phase: rand(0, Math.PI*2),
      twinkle: rand(0.002, 0.006)
    };
  }

  function init(){
    resize();
    particles = [];
    orbs = [];
    for(var i=0;i<COUNT;i++) particles.push(makeParticle());
    for(var j=0;j<ORB_COUNT;j++) orbs.push(makeOrb());
  }

  function tick(){
    ctx.clearRect(0,0,W,H);

    for(var o=0;o<orbs.length;o++){
      var b = orbs[o];
      b.y -= b.speed;
      b.x += b.drift;
      b.phase += b.twinkle;
      if(b.y < -b.r){ b.y = H + b.r; b.x = rand(0,W); }
      var oa = b.alpha * (0.6 + 0.4*Math.sin(b.phase));
      var grad = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      grad.addColorStop(0, 'rgba(255,30,40,' + oa.toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(255,30,40,0)');
      ctx.beginPath();
      ctx.fillStyle = grad;
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
    }

    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.y -= p.speed;
      p.x += p.drift;
      p.phase += p.twinkle;
      if(p.y < -10){ p.y = H + 10; p.x = rand(0,W); }
      if(p.x < -10) p.x = W+10;
      if(p.x > W+10) p.x = -10;

      var a = p.alpha * (0.55 + 0.45*Math.sin(p.phase));
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + p.color + ',' + a.toFixed(3) + ')';
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  init();
  requestAnimationFrame(tick);
})();
</script>
